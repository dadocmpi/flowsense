<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Fundo Dark Elegante com cantos arredondados -->
  <rect width="64" height="64" rx="16" fill="#07080A" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.25" />
  
  <!-- Brilho Dourado de Fundo -->
  <circle cx="32" cy="32" r="20" fill="#F59E0B" fill-opacity="0.08" filter="blur(6px)" />

  <!-- Candlestick 1 (Esquerda - Neutro/Secundário) -->
  <line x1="20" y1="18" x2="20" y2="46" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" opacity="0.4" />
  <rect x="17.5" y="24" width="5" height="14" rx="1.5" fill="#F59E0B" fill-opacity="0.35" />

  <!-- Candlestick 2 (Central - Alta Dourada Forte) -->
  <line x1="32" y1="12" x2="32" y2="52" stroke="#FBBF24" stroke-width="2.2" stroke-linecap="round" />
  <rect x="28.5" y="18" width="7" height="22" rx="2" fill="url(#goldGradient)" stroke="#FDE68A" stroke-width="0.75" />

  <!-- Candlestick 3 (Direita - Bullish Flow) -->
  <line x1="44" y1="20" x2="44" y2="48" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />
  <rect x="41.5" y="22" width="5" height="18" rx="1.5" fill="#F59E0B" fill-opacity="0.7" />

  <!-- Linha de Tendência de Fluxo / Confluência -->
  <path d="M14 44 C 24 38, 30 26, 50 16" stroke="#26A69A" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 0" opacity="0.85" />
  <circle cx="50" cy="16" r="2.5" fill="#26A69A" />

  <!-- Gradiente Dourado Premium -->
  <defs>
    <linearGradient id="goldGradient" x1="28.5" y1="18" x2="35.5" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE68A" />
      <stop offset="0.5" stop-color="#F59E0B" />
      <stop offset="1" stop-color="#D97706" />
    </linearGradient>
  </defs>
</svg>